<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צ'אטבוט תורים ואימות</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bot-bubble: #eef0f7;
    --user-bubble: #4f46e5;
    --text: #1f2333;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #eef1fb 0%, #f4f6fb 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .chat-card {
    width: 100%;
    max-width: 480px;
    height: 640px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(31, 35, 51, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chat-header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .chat-header p {
    margin: 2px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }
  .reset-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.3); }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg);
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 12px;
    padding: 0 4px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px;
    background: var(--card);
    border-top: 1px solid #eceef4;
  }
  .input-row input {
    flex: 1;
    border: 1px solid #dfe2ee;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  .input-row input:focus { border-color: var(--primary); }
  .input-row button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .input-row button:hover { background: var(--primary-dark); }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">
      <div>
        <h1>העוזר הדיגיטלי שלנו</h1>
        <p>בירור ואימות תורים</p>
      </div>
      <button class="reset-btn" id="resetBtn">שיחה חדשה</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input id="messageInput" type="text" placeholder="כתוב/י הודעה..." autocomplete="off">
      <button id="sendBtn">שליחה</button>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');

  function addBubble(text, who) {
    const div = document.createElement('div');
    div.className = 'bubble ' + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(isLoading) {
    sendBtn.disabled = isLoading;
    input.disabled = isLoading;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addBubble(text, 'user');
    input.value = '';
    setLoading(true);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      addBubble(data.reply, 'bot');
    } catch (err) {
      addBubble('מצטער, קרתה תקלה בתקשורת עם השרת. נסה/י שוב.', 'bot');
    } finally {
      setLoading(false);
      input.focus();
    }
  }

  async function resetChat() {
    await fetch('/api/reset', { method: 'POST' });
    messagesEl.innerHTML = '';
    addBubble('שלום! מה שמך, ובאיזה תאריך את/ה חושב/ת שיש לך תור?', 'bot');
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  resetBtn.addEventListener('click', resetChat);

  // Greeting on first load.
  addBubble('שלום! מה שמך, ובאיזה תאריך את/ה חושב/ת שיש לך תור?', 'bot');
  input.focus();
</script>
</body>
</html>
